# 在 pdf-converter 目录执行：
#   API_KEYS=your-secret-key docker compose -f docker-compose.yml up -d --build
services:
  converter:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf-converter:latest
    container_name: pdf-converter
    ports:
      - "8000:8000"
    environment:
      # 逗号分隔可配多个 Key；留空则关闭鉴权（仅限受信内网）
      API_KEYS: ${API_KEYS:-change-me}
      EXCEL_WORKERS: "2"
      HTML_WORKERS: "2"
      EXCEL_TIMEOUT: "180"
      HTML_TIMEOUT: "90"
      JOB_TTL: "86400"
      CJK_FONT: "Noto Sans CJK SC"
    volumes:
      # 必须挂载：任务元数据与结果 PDF，容器重建后仍保留
      - converter-data:/data
    # Chromium 渲染内存占用较高，限制容器资源防 OOM
    mem_limit: 4g
    cpus: 2
    # /dev/shm 默认 64MB 易导致 Chromium 崩溃，虽已加 --disable-dev-shm-usage，
    # 仍建议适当放大以获得更稳定的渲染表现
    shm_size: "256m"
    restart: unless-stopped

volumes:
  converter-data:
